# CI (Docs/19-estructura-del-proyecto.md §6 y §8): typecheck, lint, formato,
# reglas entre módulos y pruebas en cada push y pull request.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Base para las pruebas de integración del backend (Docs/19 §3)
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mise_ci
          POSTGRES_PASSWORD: mise_ci
          POSTGRES_DB: mise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mise_ci -d mise_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://mise_ci:mise_ci@localhost:5432/mise_test
    steps:
      - uses: actions/checkout@v7

      # Toma la versión de pnpm del campo packageManager del package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check:boundaries
      - run: pnpm test
